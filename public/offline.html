<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>offline</title>
<style>
  :root { --paper: #f4f1fb; --ink: #1a1424; --muted: #5d5470; }
  @media (prefers-color-scheme: dark) { :root { --paper: #0e0b17; --ink: #e8e2f5; --muted: #a89fc0; } }
  body { margin: 0; min-height: 100dvh; display: grid; place-content: center; gap: 8px; padding: 24px; background: var(--paper); color: var(--ink); font-family: system-ui, sans-serif; }
  h1 { margin: 0; font-weight: 500; letter-spacing: -0.03em; }
  p { margin: 0; color: var(--muted); }
</style>
</head>
<body>
<h1>you're offline</h1>
<p>Reconnect and reload to see your budget.</p>
</body>
</html>
